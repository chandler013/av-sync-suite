[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "av-sync-suite"
version = "1.0.0"
description = "Production-grade audio-video synchronization and remuxing toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "audio-sync",
    "video-processing",
    "ffmpeg",
    "mkvtoolnix",
    "lip-sync",
    "remux",
    "agent-skill",
    "antigravity"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "soundfile>=0.12.0",
]

[project.scripts]
av-sync = "scripts.av_sync_cli:main"
